<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Мобильный узел связи ЧС (КАМАЗ-43118) — AR</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="ar-viewport">
    <!-- Hidden 1x1 off-layer video decoder (prevents ALL mobile browser native Play/Pause overlays!) -->
    <video
      id="ar-video"
      playsinline
      webkit-playsinline
      muted
      autoplay
      disablepictureinpicture
      disableremoteplayback
      x-webkit-airplay="deny"
    ></video>

    <!-- Layer 1: Fullscreen Retina Camera Canvas -->
    <canvas id="ar-cam-canvas"></canvas>

    <!-- Layer 2: Fullscreen Transparent PBR 3D КАМАЗ-43118 Canvas -->
    <canvas id="three-canvas"></canvas>

    <!-- Layer 3: Subtle Corner Aim Guide (disappears completely when QR or Surface is active) -->
    <canvas id="ar-hud-canvas"></canvas>
  </div>

  <!-- Hidden Apple ARKit Quick Look anchor (requires <img> child per Safari spec for direct AR launch) -->
  <a id="ios-ar-link" rel="ar" href="./models/kamaz_comms_hub.usdz" aria-hidden="true" tabindex="-1">
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" />
  </a>

  <!-- Bottom Floating Controls (overlays both QR-Camera and WebXR DOM-Overlay) -->
  <div id="ui-overlay">
    <div id="cam-permission-prompt">
      <button id="btn-start-camera" type="button">Включить камеру AR</button>
    </div>

    <div id="bottom-ar-controls">
      <button id="btn-toggle-deploy" class="ar-bottom-btn primary-orange" type="button">
        <svg class="btn-ico" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 3v14M6 7l4-4 4 4M4 17h12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="deploy-btn-label">Свернуть в походное</span>
      </button>

      <button id="btn-place-surface" class="ar-bottom-btn surface-blue" type="button">
        <svg class="btn-ico" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M3 13.5L10 17l7-3.5M10 3l6.5 3.25v5.5L10 15l-6.5-3.25v-5.5L10 3z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="surface-btn-label">Поместить на поверхность</span>
      </button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
